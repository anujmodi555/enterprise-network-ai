[project]
name = "enterprise-network-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anujmodi555", email = "anujmodi555@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4,<5",
    "google-genai>=2.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
enterprise-network-ai = "enterprise_network_ai:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
